name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm exec eslint src/assembly/f50.ts src/views/ConfigPage.vue
      - run: go test -race ./... && go vet ./...
        working-directory: manager
      - run: sh scripts/package-f50.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f50-cat-dashboard-arm64
          path: |
            artifacts/f50-cat-dashboard-arm64.tar.gz
            artifacts/dist.zip
            artifacts/SHA256SUMS
